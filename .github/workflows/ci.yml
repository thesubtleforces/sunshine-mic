---
name: Fork CI

on:
  pull_request:
    branches: [mic]
  push:
    branches: [mic]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch:
    name: Arch
    # A local reusable workflow is resolved from this exact caller commit, not a
    # moving remote branch. PRs test the merge SHA; only push-to-mic runs can ever
    # become release candidates in the separately approved dispatch workflow.
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      source_commit: ${{ github.sha }}
    permissions:
      contents: read
