---
name: Bug report or troubleshooting
description: Get help with Sunshine Mic microphone forwarding or report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this independent community preview. Qualification and publication are pending; no released preview is claimed yet.
        See the [installation guide](https://github.com/thesubtleforces/sunshine-mic/blob/mic/packaging/omarchy/README.md) and search [existing issues](https://github.com/thesubtleforces/sunshine-mic/issues) if you can.
        Support is best effort, with no guaranteed response time. Unknown details are okay: say what you could not obtain.
        **This issue is public.** Never post credentials, pairing material, audio recordings, full configuration files, or private host/tailnet details.
        Report suspected vulnerabilities [privately](https://github.com/thesubtleforces/sunshine-mic/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Package version and source SHA
      description: Include the Sunshine Mic version, full source commit if known, and package SHA256 if available. Say unknown when unavailable.
    validations:
      required: true
  - type: textarea
    id: distribution
    attributes:
      label: Installation or distribution path
      description: How did you obtain it? Include the source commit, CI run, or package download URL as applicable; remove private filesystem paths. Prepared AUR/Omarchy routes are not published packages.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Omarchy or Arch version and host architecture
      description: Include your host distribution/version and architecture (the preview targets x86_64).
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: iPadOS and VoidLink versions
      description: Include both versions and whether microphone permission and VoidLink's microphone option are enabled. Stock Moonlight does not forward microphone audio.
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms and expected behavior
      description: What happened, and what did you expect? Include whether Moonlight Mic appears and whether the problem occurs before, during, or after a streaming session.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence you know. If intermittent, say so; do not restart or reconfigure a production session just to file this report.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted sunshine-mic doctor output
      description: Run sunshine-mic doctor without --show-addresses. Review and remove private addresses, tailnet/account names, home paths, and secrets before posting. If unavailable, include the error instead. Do not attach full logs or configs.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Mention recent upgrades or whether you manually selected the Tailscale host rather than an automatically discovered LAN entry. Keep addresses and personal data private.
